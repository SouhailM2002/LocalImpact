services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: localimpact
      POSTGRES_USER: ${POSTGRES_USER:-localimpact_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - localimpact_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  localimpact_postgres_data:
